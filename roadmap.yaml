# Roadmap editoriale evergreen — Magazine Como (magazine-como)
#
# Pilote le 1er deploiement du systeme /create-article-auto (depuis 2026-04-23).
# Source : Google Sheet "Como - feuille de route blog evergreen magazine.como.fr"
# https://docs.google.com/spreadsheets/d/1rJvJvoewI2IMLCenUxFX1mxhswmb37LiwwjvU1oHvv4
#
# Blog : https://magazine.como.fr/
# Langue principale : fr (+ EN auto dans /en/)
# Categories valides (doivent matcher hugo.toml, sans accents) :
#   - Modeles et comparatifs
#   - Financement
#   - Electrique
#   - Occasion
#   - Concessionnaires
#   - Conseils pratiques
#
# CHAMPS
# ------
# Edites par l'humain :
#   kw              Mot-cle principal SEO cible (langue principale)
#   category        Categorie du blog (liste ci-dessus)
#   volume          Volume mensuel de recherche (informatif, ignore par l'agent)
#   kd              Difficulte du mot-cle 0-100 (informatif, ignore par l'agent)
#   scheduled_date  YYYY-MM-DD, date a partir de laquelle l'agent peut publier
#   status          todo | done | failed
#
# Remplis par l'agent (ne pas toucher sauf pour debloquer un failed) :
#   published_date, published_url_fr, published_url_en, error
#
# CADENCE : 2 articles/semaine, mardi + vendredi 3h Paris (routine /schedule)
# Mardi = cluster Geely (preempt lancement France 28/04/2026 + opportunite distrib IDF Como)
# Vendredi = backlog evergreen Como
#
# COMMENT AJOUTER UNE ENTREE
# --------------------------
# 1. Copier un bloc existant a la fin de la liste `articles` ci-dessous
# 2. Renseigner kw / category (cf. liste valide plus haut) / scheduled_date (YYYY-MM-DD)
# 3. Optionnel : volume et kd (juste pour t'aider a prioriser, ignores par l'agent)
# 4. Laisser status: todo et les autres champs a null (remplis par l'agent)
# 5. Commit + push sur main. La prochaine execution cron eligible prendra l'entree.
#
# DEBLOQUER UN FAILED
# -------------------
# Si une entree a status: failed, lire le champ error pour comprendre la cause.
# Corriger, puis repasser status: todo + vider error: null. Commit + push.
#
# REGLE DE DIVERSITE DES CATEGORIES (obligatoire)
# -----------------------------------------------
# L'ordre chronologique de publication doit alterner les categories pour
# proposer un flux varie aux lecteurs et aux moteurs.
#   1. JAMAIS 2 articles consecutifs (par scheduled_date) de la meme categorie.
#   2. Sur toute fenetre glissante de 5 articles consecutifs, au moins
#      3 categories distinctes doivent etre representees.
#   3. Si peu de categories sont disponibles, alternance maximale.
# A respecter a chaque ajout d'entree ET a chaque reordonnancement.
#
# Doc complete de la skill : .claude/skills/create-article-auto/SKILL.md

